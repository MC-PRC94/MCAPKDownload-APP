# 每次 push 到 main 分支时自动构建 Debug APK
name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # 也允许在 GitHub 页面手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 构建 Debug APK
        run: gradle assembleDebug --no-daemon

      - name: 上传 APK（在 Actions 运行页面底部 Artifacts 下载）
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
